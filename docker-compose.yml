services:
  march7thassistant:
    container_name: m7a
    build: .
    # image: ghcr.io/moesnow/march7thassistant:latest
    # image: ghcr.nju.edu.cn/moesnow/march7thassistant:latest
    volumes:
      - ./config.yaml:/m7a/config.yaml
      - ./logs:/m7a/logs
      - ./3rdparty/WebBrowser/UserProfile:/m7a/3rdparty/WebBrowser/UserProfile
    environment:
      - MARCH7TH_LOG_LEVEL=DEBUG
      - MARCH7TH_MODE=${MARCH7TH_MODE:-api}
      - MARCH7TH_API_HOST=0.0.0.0
      - MARCH7TH_API_PORT=8765
      - MARCH7TH_API_TOKEN=${MARCH7TH_API_TOKEN:-}
      - MARCH7TH_TASK=${MARCH7TH_TASK:-}
      - MARCH7TH_SUPERVISOR_STARTUP_TASK=${MARCH7TH_SUPERVISOR_STARTUP_TASK:-main}
      - MARCH7TH_SUPERVISOR_NO_RUN_IMMEDIATELY=${MARCH7TH_SUPERVISOR_NO_RUN_IMMEDIATELY:-false}
    network_mode: "bridge"
    ports:
      - "${MARCH7TH_API_BIND:-127.0.0.1}:8765:8765"
    shm_size: 1g
    # MARCH7TH_MODE=cli 可直接运行 python main.py；MARCH7TH_TASK 可指定任务 ID。
    restart: unless-stopped
    # 如果只是临时执行一次子任务，建议改为：
    # restart: "no"
