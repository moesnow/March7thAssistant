[project]
name = "march7thassistant"
version = "0.1.0"
description = "March7thAssistant automation app"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ruamel.yaml==0.19.1",
    "playsound3==3.3.1",
    "psutil==7.2.2",
    "pyautogui==0.9.54",
    "mss==10.2.0",
    "pygetwindow==0.0.9; sys_platform == 'win32'",
    "requests[socks]==2.34.2",
    "charset_normalizer==3.4.7",
    "Pillow==12.3.0",
    "numpy==2.4.6",
    "opencv-python==4.13.0.92",
    "winotify==1.1.0; sys_platform == 'win32'",
    "Markdown==3.10.2",
    "PySide6-Fluent-Widgets==1.11.2",
    "PySideSix-Frameless-Window==0.8.1",
    "PySide6==6.11.1",
    "pylnk3==0.4.3",
    "qrcode==8.2",
    "PySocks==1.7.1",
    "PyPAC==0.18.3",
    "matrix-nio==0.25.2",
    "python-socks[asyncio]==2.8.1",
    "openpyxl==3.1.5",
    "selenium==4.44.0",
    "keyboard==0.13.5",
    "opencc==1.3.1",
    "rapidocr==3.8.1",
    "onnxruntime-directml==1.24.4; sys_platform == 'win32'",
    "onnxruntime==1.26.0; sys_platform == 'darwin' or sys_platform == 'linux'",
    "openvino==2026.2.0",
    "py7zr==1.1.3",
]

[dependency-groups]
# Docker 专用依赖：排除 GUI 和 Windows 专属包，其余与 main 保持同步
docker = [
    "ruamel.yaml==0.19.1",
    "playsound3==3.3.1",
    "psutil==7.2.2",
    "requests[socks]==2.34.2",
    "charset_normalizer==3.4.7",
    "Pillow==12.3.0",
    "numpy==2.4.6",
    "opencv-python==4.13.0.92",
    "PySocks==1.7.1",
    "PyPAC==0.18.3",
    "matrix-nio==0.25.2",
    "python-socks[asyncio]==2.8.1",
    "selenium==4.44.0",
    "rapidocr==3.8.1",
    "onnxruntime==1.26.0",
    "openvino==2026.2.0",
]

build = [
    "pyinstaller==6.20.0",
]

dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-qt>=4.4",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
